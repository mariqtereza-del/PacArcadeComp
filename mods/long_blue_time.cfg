# Example mod 2: long blue time.
# What it does: after an energizer the ghosts stay blue twice as long (200 percent), on every level. On the levels where the arcade game
# gives almost no blue time (the late levels) you get a real blue time again.
# How to use it: rename this file to rules.cfg and put it next to PacArcadeComp.exe, then start the program. The window title says MODDED.
frightened_time_percent 200
