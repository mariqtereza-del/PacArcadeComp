# Example mod 3: double points.
# What it does: dots, energizers and ghosts are worth twice as much. The extra life comes at 20000 points.
# How to use it: rename this file to rules.cfg and put it next to PacArcadeComp.exe, then start the program. The window title says MODDED.
# (The little picture of "200" that appears when a ghost is eaten keeps showing the original number; the score gets the doubled points.)
dot_points 20
energizer_points 100
ghost1_points 400
ghost2_points 800
ghost3_points 1600
ghost4_points 3200
extra_life_score 20000
