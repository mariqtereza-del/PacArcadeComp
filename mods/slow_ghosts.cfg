# Example mod 1: slow ghosts.
# What it does: the ghosts (in every phase, also blue and in the tunnel) move at 60 percent of their normal speed. Pac-Man is not changed.
# How to use it: rename this file to rules.cfg and put it next to PacArcadeComp.exe, then start the program. The window title says MODDED.
ghost_speed_percent 60
