# Pac-Man port controls. You can edit this file with Notepad, or change the controls in the game (F9 keys, F10 pad, F12 reset).
# Keys are named as in SDL (Up, W, Space, Keypad 5, Left Shift ...). "none" = not used.
up = Up, W
down = Down, S
left = Left, A
right = Right, D
coin = 5, Keypad 5
start1 = 1, Keypad 1
start2 = 2, Keypad 2
pad_coin = back
pad_start1 = start
pad_start2 = none
one_button_start = on
